<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d1117">
  <title>مشغل المساجد</title>

  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0"
    rel="stylesheet" />

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --accent: #22c55e;
      --accent-dark: #16a34a;
      --card-bg: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.14);
      --text-1: #ffffff;
      --text-2: rgba(255, 255, 255, 0.60);
    }

    html,
    body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: 'Amiri', serif;
      background: #0d1117;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* ── Background ── */
    #bgBlur {
      position: fixed;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: blur(40px) brightness(0.30) saturate(1.5);
      transform: scale(1.18);
      transition: background-image 0.7s ease;
      z-index: 0;
    }

    #bgOverlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg,
          rgba(0, 0, 0, 0.50) 0%,
          rgba(0, 0, 0, 0.10) 45%,
          rgba(0, 0, 0, 0.72) 100%);
      z-index: 1;
    }

    /* ── Shell ── */
    .shell {
      position: relative;
      z-index: 2;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: max(env(safe-area-inset-top, 16px), 20px);
      padding-bottom: max(env(safe-area-inset-bottom, 16px), 20px);
      gap: 0;
    }

    /* ── Top label ── */
    .top-label {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--text-2);
      text-transform: uppercase;
      padding: 0 0 14px;
    }

    /* ── Artwork ── */
    .artwork-wrap {
      position: relative;
      width: min(66vw, 256px);
      aspect-ratio: 1;
      flex-shrink: 0;
    }

    /* ambient glow */
    .artwork-wrap::after {
      content: '';
      position: absolute;
      inset: -14px;
      border-radius: 30px;
      background: radial-gradient(circle, rgba(34, 197, 94, 0.30) 0%, transparent 68%);
      animation: glow 3.2s ease-in-out infinite;
      z-index: -1;
    }

    @keyframes glow {

      0%,
      100% {
        opacity: .5;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.06);
      }
    }

    #mosqueImage {
      width: 100%;
      height: 100%;
      border-radius: 22px;
      background-size: cover;
      background-position: center;
      background-color: #1c2230;
      box-shadow:
        0 20px 56px rgba(0, 0, 0, 0.6),
        0 0 0 1.5px rgba(255, 255, 255, 0.10);
      transition: background-image 0.5s ease;
    }

    /* ── Mosque name ── */
    .name-block {
      margin-top: 22px;
      text-align: center;
      padding: 0 28px;
      width: 100%;
    }

    #mosqueName {
      font-size: clamp(1.45rem, 5.5vw, 1.85rem);
      font-weight: 700;
      color: var(--text-1);
      line-height: 1.25;
      text-shadow: 0 2px 16px rgba(0, 0, 0, 0.55);
      /* single line with ellipsis if too long */
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #mosqueSubtitle {
      font-size: 0.85rem;
      color: var(--text-2);
      margin-top: 5px;
      letter-spacing: 0.04em;
    }

    /* ── Status pill ── */
    .status-wrap {
      margin-top: 12px;
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* shared pill styles */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border-radius: 50px;
      padding: 5px 16px;
      font-size: 0.80rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      transition: opacity 0.3s;
    }

    /* LIVE pill */
    .pill-live {
      background: rgba(239, 68, 68, 0.16);
      border: 1px solid rgba(239, 68, 68, 0.38);
      color: #f87171;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ef4444;
      animation: blink 1.2s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.2;
      }
    }

    /* LOADING pill */
    .pill-loading {
      background: rgba(251, 191, 36, 0.13);
      border: 1px solid rgba(251, 191, 36, 0.35);
      color: #fbbf24;
    }

    .spin-icon {
      font-size: 16px !important;
      animation: spin 1s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ERROR pill */
    .pill-error {
      background: rgba(239, 68, 68, 0.10);
      border: 1px solid rgba(239, 68, 68, 0.28);
      color: #fca5a5;
    }

    /* IDLE – invisible placeholder */
    .pill-idle {
      opacity: 0;
      pointer-events: none;
    }

    /* ── Spacer ── */
    .spacer {
      flex: 1;
    }

    /* ── Player card ── */
    .player-card {
      width: calc(100% - 32px);
      max-width: 400px;
      background: var(--card-bg);
      backdrop-filter: blur(30px) saturate(1.6);
      -webkit-backdrop-filter: blur(30px) saturate(1.6);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 20px 24px 24px;
      box-shadow: 0 20px 52px rgba(0, 0, 0, 0.50);
      flex-shrink: 0;
    }

    /* dots */
    .dots-row {
      display: flex;
      justify-content: center;
      gap: 9px;
      margin-bottom: 18px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.22);
      transition: background 0.3s, transform 0.3s;
      cursor: pointer;
    }

    .dot.active {
      background: var(--accent);
      transform: scale(1.35);
    }

    /* controls */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .ctrl-btn {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 1.5px solid var(--card-border);
      background: rgba(255, 255, 255, 0.09);
      color: var(--text-1);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      -webkit-user-select: none;
      user-select: none;
    }

    .ctrl-btn:active {
      transform: scale(0.90);
      background: rgba(255, 255, 255, 0.18);
    }

    .ctrl-btn .material-symbols-rounded {
      font-size: 26px;
    }

    #playBtn {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(145deg, var(--accent) 0%, var(--accent-dark) 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(34, 197, 94, 0.45);
      transition: transform 0.15s, box-shadow 0.2s, background 0.3s;
      -webkit-user-select: none;
      user-select: none;
    }

    #playBtn:active {
      transform: scale(0.90);
    }

    #playBtn .material-symbols-rounded {
      font-size: 36px;
    }

    #playBtn.loading {
      background: linear-gradient(145deg, #60a5fa 0%, #2563eb 100%);
      box-shadow: 0 8px 30px rgba(59, 130, 246, 0.45);
    }

    /* small mosque name under controls */
    .card-title {
      font-size: 0.82rem;
      color: var(--text-2);
      text-align: center;
      margin-top: 16px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Icon font loading guard ── */
    /* Icons are invisible until font is confirmed loaded */
    .material-symbols-rounded {
      visibility: hidden;
      transition: opacity 0.25s;
      opacity: 0;
    }

    body.icons-ready .material-symbols-rounded {
      visibility: visible;
      opacity: 1;
    }

    /* Arabic fallback labels shown inside each button */
    .btn-label {
      font-size: 0.65rem;
      font-family: 'Amiri', serif;
      color: inherit;
      line-height: 1;
      transition: opacity 0.25s;
      opacity: 1;
      /* sits in same space as icon */
      position: absolute;
    }

    body.icons-ready .btn-label {
      opacity: 0;
      pointer-events: none;
    }

    /* Status pill: use CSS-drawn shapes for icons, no ligature text */
    .s-icon {
      width: 14px;
      height: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* spinning border for loading */
    .s-icon.s-spin {
      border: 2px solid rgba(251, 191, 36, 0.35);
      border-top-color: #fbbf24;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    /* wifi-off X shape for error - simple red × */
    .s-icon.s-err::before {
      content: '✕';
      font-size: 11px;
      color: #fca5a5;
      font-family: sans-serif;
    }
  </style>
</head>

<body>

  <div id="bgBlur"></div>
  <div id="bgOverlay"></div>

  <div class="shell">

    <span class="top-label">بث مباشر · المساجد</span>

    <!-- Artwork -->
    <div class="artwork-wrap">
      <div id="mosqueImage"></div>
    </div>

    <!-- Title block -->
    <div class="name-block">
      <h1 id="mosqueName"></h1>
      <p id="mosqueSubtitle">بث مباشر</p>
    </div>

    <!-- Status pill -->
    <div class="status-wrap">
      <div id="statusPill" class="pill pill-idle">
        <span id="statusIcon" class="material-symbols-rounded" style="font-size:16px"></span>
        <span id="statusText"></span>
      </div>
    </div>

    <div class="spacer"></div>

    <!-- Player card -->
    <div class="player-card">
      <div class="dots-row" id="dotsRow"></div>

      <div class="controls">
        <button class="ctrl-btn" onclick="prevMosque()" style="position:relative">
          <span class="material-symbols-rounded">skip_previous</span>
          <span class="btn-label">السابق</span>
        </button>

        <button id="playBtn" onclick="togglePlay()" style="position:relative">
          <span class="material-symbols-rounded" id="playIcon">play_arrow</span>
          <span class="btn-label" id="playLabel">تشغيل</span>
        </button>

        <button class="ctrl-btn" onclick="nextMosque()" style="position:relative">
          <span class="material-symbols-rounded">skip_next</span>
          <span class="btn-label">التالي</span>
        </button>
      </div>

      <div class="card-title" id="cardTitle"></div>
    </div>

  </div>

  <audio id="audioPlayer"></audio>

  <script>
    const mosques = [
      {
        name: "مسجد أبي سالم",
        image: "https://laapsspdqubwynynnioh.supabase.co/storage/v1/object/public/tamjida/mosque1.jpg",
        stream: "http://137.66.18.220:8000/;"
      },
      {
        name: "المسجد العتيق",
        image: "https://laapsspdqubwynynnioh.supabase.co/storage/v1/object/public/tamjida/mosq2.jpg",
        stream: "http://masjidatik.fly.dev/;"
      }
    ];

    /**
     * On HTTPS (Vercel) route through the Edge Function proxy so the browser
     * never touches the raw HTTP endpoint (mixed-content block).
     * On file:// or http:// (local dev) use the stream URL directly.
     */
    function getStreamUrl(rawUrl) {
      if (location.protocol === 'https:') {
        return '/api/stream?url=' + encodeURIComponent(rawUrl);
      }
      return rawUrl;
    }

    let current = 0, isPlaying = false, loadingTimeout;

    const player = document.getElementById("audioPlayer");
    const mosqueName = document.getElementById("mosqueName");
    const mosqueImage = document.getElementById("mosqueImage");
    const bgBlur = document.getElementById("bgBlur");
    const playIcon = document.getElementById("playIcon");
    const playBtn = document.getElementById("playBtn");
    const statusPill = document.getElementById("statusPill");
    const statusIcon = document.getElementById("statusIcon");
    const statusText = document.getElementById("statusText");
    const dotsRow = document.getElementById("dotsRow");
    const cardTitle = document.getElementById("cardTitle");

    /* ── Status pill states (no ligature text — CSS-drawn icons only) ── */
    function setStatus(state) {
      statusPill.className = 'pill';
      statusIcon.className = 's-icon';   // reset
      statusIcon.innerHTML = '';
      if (state === 'live') {
        statusPill.classList.add('pill-live');
        statusIcon.innerHTML = '<span class="live-dot"></span>';
        statusText.innerText = 'مباشر الآن';
      } else if (state === 'loading') {
        statusPill.classList.add('pill-loading');
        statusIcon.classList.add('s-spin');
        statusText.innerText = 'جاري الاتصال...';
      } else if (state === 'error') {
        statusPill.classList.add('pill-error');
        statusIcon.classList.add('s-err');
        statusText.innerText = 'البث غير متاح حالياً';
      } else {
        statusPill.classList.add('pill-idle');
        statusIcon.innerHTML = '';
        statusText.innerText = '';
      }
    }

    /* ── Dots ── */
    function buildDots() {
      dotsRow.innerHTML = '';
      mosques.forEach((_, i) => {
        const d = document.createElement('div');
        d.className = 'dot' + (i === current ? ' active' : '');
        d.onclick = () => jumpTo(i);
        dotsRow.appendChild(d);
      });
    }
    function updateDots() {
      [...dotsRow.children].forEach((d, i) => d.classList.toggle('active', i === current));
    }

    /* ── Load mosque ── */
    function loadMosque() {
      const m = mosques[current];
      mosqueName.innerText = m.name;
      cardTitle.innerText = m.name;
      mosqueImage.style.backgroundImage = `url('${m.image}')`;
      bgBlur.style.backgroundImage = `url('${m.image}')`;
      updateDots();
    }

    /* ── Reset player ── */
    function resetPlayer() {
      clearTimeout(loadingTimeout);
      player.pause();
      player.removeAttribute("src");
      player.load();
      isPlaying = false;
      playIcon.innerText = "play_arrow";
      playBtn.classList.remove("loading");
      const pl = document.getElementById('playLabel');
      if (pl) pl.innerText = 'تشغيل';
      setStatus('idle');
    }

    /* ── Start stream ── */
    function startStream() {
      player.src = getStreamUrl(mosques[current].stream);
      setStatus('loading');
      playIcon.innerText = "pause";
      playBtn.classList.add("loading");
      const pl = document.getElementById('playLabel');
      if (pl) pl.innerText = 'إيقاف';
      isPlaying = true;

      player.play().catch(() => streamError());

      loadingTimeout = setTimeout(() => {
        if (player.readyState < 3) streamError();
      }, 10000);
    }

    function streamError() {
      clearTimeout(loadingTimeout);
      player.pause();
      isPlaying = false;
      playIcon.innerText = "play_arrow";
      playBtn.classList.remove("loading");
      const pl = document.getElementById('playLabel');
      if (pl) pl.innerText = 'تشغيل';
      setStatus('error');
    }

    function togglePlay() {
      isPlaying ? resetPlayer() : startStream();
    }

    function jumpTo(index) {
      // Always reset and auto-play — dots/switch act as a refresh too
      resetPlayer();
      current = index;
      loadMosque();
      startStream();
    }
    function nextMosque() { resetPlayer(); current = (current + 1) % mosques.length; loadMosque(); startStream(); }
    function prevMosque() { resetPlayer(); current = (current - 1 + mosques.length) % mosques.length; loadMosque(); startStream(); }

    /* ── Audio listeners ── */
    player.addEventListener("playing", () => {
      clearTimeout(loadingTimeout);
      playBtn.classList.remove("loading");
      setStatus('live');
    });
    player.addEventListener("error", () => streamError());
    player.addEventListener("waiting", () => {
      if (isPlaying) { setStatus('loading'); playBtn.classList.add("loading"); }
    });

    /* ── Init ── */
    buildDots();
    loadMosque();

    /* ── Icon font guard: reveal icons only after font is ready ── */
    document.fonts.ready.then(() => {
      // Double-check the specific font is actually loaded
      if (document.fonts.check('1em "Material Symbols Rounded"')) {
        document.body.classList.add('icons-ready');
      } else {
        // Fallback: wait a bit then check again
        setTimeout(() => {
          document.body.classList.add('icons-ready');
        }, 2000);
      }
    });
  </script>
</body>

</html>
